<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de planta - Vivero Raíz</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/formulario.css">
</head>
<body class="gestion">
    <header>
        <h1>Vivero Raíz</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="entrada"><a href="login.html">Iniciar sesión</a></li>
                <li id="listado" hidden><a href="listado.html">Gestión de plantas</a></li>
                <li id="salida" hidden><button type="button" id="cerrar">Cerrar sesión</button></li>
            </ul>
        </nav>

    </header>

    <main class="formulario">
        <h2>Agregar una planta</h2>
        <p>Completá los datos de la planta.</p>
        <p>Este formulario es una maqueta: todavía no guarda cambios.</p>

        <form>
            <div>
                <label>Nombre de la planta:
                <input type="text"></label>
            </div>

            <div>
                <label>Descripción:
                <textarea
                          rows="4"></textarea></label>
            </div>

            <div>
                <label>Precio:
                <input type="number"></label>
            </div>

            <div>
                <label>Categoría:
                <select>
                    <option value="">Seleccioná una categoría</option>
                    <option value="interior">Interior</option>
                    <option value="exterior">Exterior</option>
                    <option value="suculentas">Suculentas</option>
                </select></label>
            </div>

            <div>
                <label>Imagen de la planta:
                <input type="file"></label>
            </div>

            <div>
                <label>Cuidados:
                <textarea
                          rows="4"></textarea></label>
            </div>

            <button type="button">Guardar planta</button>

        </form>

        <p><a href="listado.html">Cancelar y volver al listado</a></p>
    </main>

    <footer>
        <p>&copy; 2026 Vivero Raíz.</p>
    </footer>
    <script src="js/sesion.js"></script>

</body>
</html>
