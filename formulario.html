<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de planta - Vivero Raíz</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Vivero Raíz</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Agregar o editar una planta</h2>
        <p>Completá los datos de la planta.</p>
        <p>Este formulario es una maqueta: todavía no guarda cambios.</p>

        <form>
            <div>
                <label for="nombre">Nombre de la planta:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion"
                          rows="4" required></textarea>
            </div>

            <div>
                <label for="precio">Precio:</label>
                <input type="number" id="precio" name="precio"
                       min="0" step="0.01" required>
            </div>

            <div>
                <label for="categoria">Categoría:</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Seleccioná una categoría</option>
                    <option value="interior">Interior</option>
                    <option value="exterior">Exterior</option>
                    <option value="suculentas">Suculentas</option>
                </select>
            </div>

            <div>
                <label for="imagen">Imagen de la planta:</label>
                <input type="file" id="imagen" name="imagen"
                       accept="image/*">
            </div>

            <div>
                <label for="cuidados">Cuidados:</label>
                <textarea id="cuidados" name="cuidados"
                          rows="4"></textarea>
            </div>

            <button type="button">Guardar planta</button>
        </form>

        <p><a href="listado.html">Cancelar y volver al listado</a></p>
    </main>

    <footer>
        <p>&copy; 2026 Vivero Raíz.</p>
    </footer>
</body>
</html>
