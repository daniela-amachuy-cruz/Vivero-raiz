<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Vivero Raíz</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header>
        <h1>Vivero Raíz</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="entrada"><a href="login.html">Iniciar sesión</a></li>
                <li id="listado" hidden><a href="listado.html">Gestión de plantas</a></li>
                <li id="salida" hidden><button type="button" id="cerrar">Cerrar sesión</button></li>
            </ul>
        </nav>

    </header>

    <main class="formulario">
        <h2>Ingresar</h2>
        <p>Gestión de catálogo</p>

        <form id="login">
            <div>
                <label>Correo electrónico:
                <input type="text" id="email" name="email"
                       placeholder="nombre@gmail.com"></label>
            </div>

            <div>
                <label>Contraseña:
                <input type="password" id="password"
                       name="password"></label>
            </div>
            <p>La sesión se mantiene abierta hasta que la cierres.</p>

            <button type="submit">Ingresar</button>
            <p id="mensaje" role="alert"></p>
        </form>

        <p>
            ¿Olvidaste tu contraseña?
            <a href="contacto.html">Contactanos</a>
        </p>

        <p>
            ¿No tenés cuenta?
            <a href="registro.html">Registrate</a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 Vivero Raíz.</p>
    </footer>
    <script src="js/sesion.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
