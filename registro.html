<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Vivero Raíz</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Vivero Raíz</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Crear una cuenta</h2>
        <p>Completá tus datos para registrarte.</p>
        <p>Este formulario es una maqueta: todavía no crea cuentas.</p>

        <form>
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>

            <div>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password"
                       name="password" required>
            </div>

            <div>
                <label for="confirmar">Repetir contraseña:</label>
                <input type="password" id="confirmar"
                       name="confirmar" required>
            </div>

            <button type="button">Registrarme</button>
        </form>

        <p>
            ¿Ya tenés cuenta?
            <a href="login.html">Iniciar sesión</a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 Vivero Raíz.</p>
    </footer>
</body>
</html>
