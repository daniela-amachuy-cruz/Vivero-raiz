<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Vivero Raíz</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <header>
        <h1>Vivero Raíz</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="entrada"><a href="login.html">Iniciar sesión</a></li>
                <li id="listado" hidden><a href="listado.html">Gestión de plantas</a></li>
                <li id="salida" hidden><button type="button" id="cerrar">Cerrar sesión</button></li>
            </ul>
        </nav>

    </header>

    <main class="formulario">
        <h2>Crear una cuenta</h2>
        <p>Completá tus datos para registrarte.</p>
        <p>Este formulario es una maqueta: todavía no crea cuentas.</p>

        <form>
            <div>
                <label>Nombre:
                <input type="text"></label>
            </div>

            <div>
                <label>Apellido:
                <input type="text"></label>
            </div>

            <div>
                <label>Correo electrónico:
                <input type="email"></label>
            </div>

            <div>
                <label>Contraseña:
                <input type="password"></label>
            </div>

            <div>
                <label>Repetir contraseña:
                <input type="password"></label>
            </div>

            <button type="button">Registrarme</button>

        </form>

        <p>
            ¿Ya tenés cuenta?
            <a href="login.html">Iniciar sesión</a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 Vivero Raíz.</p>
    </footer>
    <script src="js/sesion.js"></script>

</body>
</html>
